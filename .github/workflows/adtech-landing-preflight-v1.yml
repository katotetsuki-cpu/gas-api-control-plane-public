name: AdTech Landing Preflight V1

on:
  push:
    paths:
      - '.github/workflows/adtech-landing-preflight-v1.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_REAUTH_REDIRECT_URL: ${{ secrets.GOOGLE_REAUTH_REDIRECT_URL }}
      ADTECH_GAS_SCRIPT_ID: ${{ secrets.ADTECH_GAS_SCRIPT_ID }}
      CLASP_OAUTH_CLIENT_ID: '1072944905499-vm2v2i5dvn0a0d2o4ca36i1vge8cvbn0.apps.googleusercontent.com'
      CLASP_OAUTH_CLIENT_SECRET: 'v6V3fKV_zWU7iw1DrpO1rknX'
      BUNDLE_DOC_ID: '1wndyHvfePE0LwXyRFpyRRcZpPPU4muObKnckuzqA-pE'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse preflight reauthorization redirect
        shell: bash
        run: |
          set -euo pipefail
          for v in GOOGLE_REFRESH_TOKEN GOOGLE_REAUTH_REDIRECT_URL ADTECH_GAS_SCRIPT_ID; do
            val="${!v:-}"
            test -n "$val" || { echo "MISSING_${v}"; exit 1; }
            echo "::add-mask::${val}"
          done
          python3 - <<'PY'
          import base64, hashlib, hmac, os, urllib.parse
          u = urllib.parse.urlparse(os.environ["GOOGLE_REAUTH_REDIRECT_URL"])
          q = urllib.parse.parse_qs(u.query)
          code = (q.get("code") or [""])[0]
          state = (q.get("state") or [""])[0]
          refresh = os.environ["GOOGLE_REFRESH_TOKEN"].encode()
          script_id = os.environ["ADTECH_GAS_SCRIPT_ID"].encode()
          def b64u(b):
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          expected_state = b64u(hmac.new(refresh, b"spf-adtech-landing-preflight-state-v2|" + script_id, hashlib.sha256).digest())
          verifier = b64u(hashlib.sha256(b"spf-adtech-landing-preflight-verifier-v2|" + refresh + b"|" + script_id).digest())
          if not code:
              raise SystemExit("REAUTH_CODE_MISSING")
          if state != expected_state:
              raise SystemExit("REAUTH_STATE_MISMATCH")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("GOOGLE_REAUTH_CODE=" + code + "\n")
              f.write("GOOGLE_REAUTH_CODE_VERIFIER=" + verifier + "\n")
          print("REAUTH_REDIRECT_PARSE_PASS")
          PY

      - name: Exchange authorization code
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${GOOGLE_REAUTH_CODE}"
          echo "::add-mask::${GOOGLE_REAUTH_CODE_VERIFIER}"
          code="$(curl -sS -o token.json -w '%{http_code}' -X POST \
            --data-urlencode "client_id=${CLASP_OAUTH_CLIENT_ID}" \
            --data-urlencode "client_secret=${CLASP_OAUTH_CLIENT_SECRET}" \
            --data-urlencode "code=${GOOGLE_REAUTH_CODE}" \
            --data-urlencode "code_verifier=${GOOGLE_REAUTH_CODE_VERIFIER}" \
            --data-urlencode 'redirect_uri=http://localhost:8888' \
            --data-urlencode 'grant_type=authorization_code' \
            'https://oauth2.googleapis.com/token')"
          echo "AUTH_CODE_EXCHANGE_HTTP_${code}"
          if [ "$code" != '200' ]; then
            echo "OAUTH_ERROR=$(jq -r '.error // "none"' token.json)"
            echo "OAUTH_ERROR_DESCRIPTION=$(jq -r '.error_description // "none"' token.json)"
            rm -f token.json
            exit 1
          fi
          at="$(jq -r '.access_token // empty' token.json)"
          test -n "$at" || { echo 'ACCESS_TOKEN_MISSING'; rm -f token.json; exit 1; }
          echo "::add-mask::${at}"
          printf 'GOOGLE_ACCESS_TOKEN=%s\n' "$at" >> "$GITHUB_ENV"
          rm -f token.json
          echo 'AUTH_CODE_EXCHANGE_PASS'

      - name: Assert required scopes
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -o tokeninfo.json "https://oauth2.googleapis.com/tokeninfo?access_token=${GOOGLE_ACCESS_TOKEN}"
          scope="$(jq -r '.scope // ""' tokeninfo.json)"
          rm -f tokeninfo.json
          case " ${scope} " in
            *" https://www.googleapis.com/auth/script.projects "*) echo 'SCOPE_SCRIPT_PROJECTS_PASS' ;;
            *) echo 'SCOPE_SCRIPT_PROJECTS_FAIL'; exit 1 ;;
          esac
          case " ${scope} " in
            *" https://www.googleapis.com/auth/drive.readonly "*) echo 'SCOPE_DRIVE_READONLY_PASS' ;;
            *) echo 'SCOPE_DRIVE_READONLY_FAIL'; exit 1 ;;
          esac

      - name: Read private Drive landing bundle
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o bundle.txt -w '%{http_code}' \
            --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
            --get \
            --data-urlencode 'mimeType=text/plain' \
            "https://www.googleapis.com/drive/v3/files/${BUNDLE_DOC_ID}/export")"
          echo "BUNDLE_EXPORT_HTTP_${code}"
          test "$code" = '200' || { rm -f bundle.txt; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("bundle.txt")
          data = json.loads(p.read_text(encoding="utf-8").strip())
          assert data["bundle_id"] == "SPF_ADTECH_MANAGEMENT_SLACK_V144_LANDING_BUNDLE_20260918"
          assert data["expected_preimage_fingerprint"] == "84af8a3e6d71548b0aa4bcf4235a2261a4055dd5941b23fa15cf7ac74b3e8281"
          assert data["expected_postimage_fingerprint"] == "3147db172d15155870e2429d3306d7dce9b5fd7b6d924ac1215a05b8deaf33bb"
          assert len(data["files"]) == 7
          print("BUNDLE_IDENTITY_PASS")
          PY

      - name: Read current Production Apps Script
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o content.json -w '%{http_code}' \
            --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
            "https://script.googleapis.com/v1/projects/${ADTECH_GAS_SCRIPT_ID}/content")"
          echo "GET_CONTENT_HTTP_${code}"
          test "$code" = '200' || { rm -f content.json; exit 1; }
          echo 'GET_CONTENT_HTTP_200'

      - name: Reproduce guarded merge without write
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/adtech_gas_land_v1.py content.json bundle.txt update.json
          test -s update.json
          echo 'LANDING_PREFLIGHT_ONLY_PASS'
          echo 'PRODUCTION_MUTATION_COUNT=0'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f token.json tokeninfo.json bundle.txt content.json update.json
