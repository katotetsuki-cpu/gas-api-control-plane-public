name: AdTech GAS Readonly V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/adtech-gas-readonly-v2.yml'

permissions:
  contents: read

jobs:
  get-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      ADTECH_GAS_SCRIPT_ID: ${{ secrets.ADTECH_GAS_SCRIPT_ID }}
      CLASP_OAUTH_CLIENT_ID: '1072944905499-vm2v2i5dvn0a0d2o4ca36i1vge8cvbn0.apps.googleusercontent.com'
    steps:
      - name: Validate secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_REFRESH_TOKEN:-}" || { echo 'MISSING_GOOGLE_REFRESH_TOKEN'; exit 1; }
          test -n "${ADTECH_GAS_SCRIPT_ID:-}" || { echo 'MISSING_ADTECH_GAS_SCRIPT_ID'; exit 1; }
          echo "::add-mask::${GOOGLE_REFRESH_TOKEN}"
          echo "::add-mask::${ADTECH_GAS_SCRIPT_ID}"
          echo 'CREDENTIAL_PRESENCE_PASS'

      - name: Exchange existing refresh token
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output token.json --write-out '%{http_code}' \
            --request POST \
            --data-urlencode "client_id=${CLASP_OAUTH_CLIENT_ID}" \
            --data-urlencode "refresh_token=${GOOGLE_REFRESH_TOKEN}" \
            --data-urlencode 'grant_type=refresh_token' \
            'https://oauth2.googleapis.com/token')"
          if [ "$code" != '200' ]; then
            echo "TOKEN_EXCHANGE_HTTP_${code}"
            rm -f token.json
            exit 1
          fi
          access_token="$(python3 - <<'PY'
          import json
          with open('token.json', encoding='utf-8') as f:
              print(json.load(f).get('access_token',''))
          PY
          )"
          test -n "$access_token" || { echo 'ACCESS_TOKEN_MISSING'; rm -f token.json; exit 1; }
          echo "::add-mask::${access_token}"
          printf 'GOOGLE_ACCESS_TOKEN=%s\n' "$access_token" >> "$GITHUB_ENV"
          rm -f token.json
          echo 'TOKEN_EXCHANGE_PASS'

      - name: Read Production Apps Script content
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output content.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
            "https://script.googleapis.com/v1/projects/${ADTECH_GAS_SCRIPT_ID}/content")"
          if [ "$code" != '200' ]; then
            echo "GET_CONTENT_HTTP_${code}"
            rm -f content.json
            exit 1
          fi
          echo 'GET_CONTENT_HTTP_200'

      - name: Build source-free receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path('content.json').read_text(encoding='utf-8'))
          files = data.get('files') or []
          normalized = []
          total = 0
          manifest_present = False
          for f in files:
              name = str(f.get('name',''))
              typ = str(f.get('type',''))
              src = str(f.get('source',''))
              if name == 'appsscript' and typ == 'JSON': manifest_present = True
              b = src.encode('utf-8')
              total += len(b)
              normalized.append({'name_sha256':hashlib.sha256(name.encode()).hexdigest(),'type':typ,'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b)})
          normalized.sort(key=lambda x:(x['name_sha256'],x['type']))
          aggregate = hashlib.sha256(json.dumps(normalized,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          receipt = {'state':'PASS_READONLY_GETCONTENT' if manifest_present else 'FAIL_MANIFEST_MISSING','file_count':len(files),'manifest_present':manifest_present,'total_source_bytes':total,'aggregate_fingerprint':aggregate,'source_exposed':False,'mutation_count':0}
          Path('receipt.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(Path('receipt.json').read_text(encoding='utf-8'),end='')
          if not manifest_present: raise SystemExit(1)
          PY

      - name: Encrypt live source for AI inspection
        shell: bash
        run: |
          set -euo pipefail
          cat > recipient-cert.pem <<'CERT'
