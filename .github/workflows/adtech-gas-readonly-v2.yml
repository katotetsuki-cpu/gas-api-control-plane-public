name: Bank Ads Bootstrap Pin Rebase 20261008

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/adtech-gas-readonly-v2.yml'

permissions:
  contents: read

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      BANKADS_GAS_SCRIPT_ID: '17ZNQ5alw0-fubjjQ2vi3DnuH67P9jrCHc40xYaoldVezDcIaY0Qkgpk9'
      CLASP_OAUTH_CLIENT_ID: '1072944905499-vm2v2i5dvn0a0d2o4ca36i1vge8cvbn0.apps.googleusercontent.com'
      OLD_OUTER_SHA: '838bbf903c3de2d7ee982f2b0b66237d917c2911bc1ea94100a0e48ea0068391'
      NEW_OUTER_SHA: '3ea51a050b2657c2f0fb9022ee122d41dd37948711dbc21d63a8154e05d0513f'
    steps:
      - name: Exchange existing refresh token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_REFRESH_TOKEN:-}" || { echo MISSING_GOOGLE_REFRESH_TOKEN; exit 1; }
          echo "::add-mask::${GOOGLE_REFRESH_TOKEN}"
          code="$(curl --silent --show-error --output token.json --write-out '%{http_code}'             --request POST             --data-urlencode "client_id=${CLASP_OAUTH_CLIENT_ID}"             --data-urlencode "refresh_token=${GOOGLE_REFRESH_TOKEN}"             --data-urlencode 'grant_type=refresh_token'             'https://oauth2.googleapis.com/token')"
          test "$code" = 200 || { echo "TOKEN_EXCHANGE_HTTP_$code"; exit 1; }
          access_token="$(python3 - <<'PY'
import json
print(json.load(open('token.json')).get('access_token',''))
PY
)"
          test -n "$access_token"
          echo "::add-mask::$access_token"
          echo "GOOGLE_ACCESS_TOKEN=$access_token" >> "$GITHUB_ENV"
          rm -f token.json

      - name: Read and validate current Production Apps Script
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output before.json --write-out '%{http_code}'             --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}"             "https://script.googleapis.com/v1/projects/${BANKADS_GAS_SCRIPT_ID}/content")"
          test "$code" = 200 || { echo "GET_CONTENT_HTTP_$code"; exit 1; }
          python3 - <<'PY'
import json,os
p=json.load(open('before.json'))
old=os.environ['OLD_OUTER_SHA']; new=os.environ['NEW_OUTER_SHA']
hits=[]
for i,f in enumerate(p.get('files') or []):
    s=str(f.get('source',''))
    if 'BOOT_SOURCE_OUTER_SHA_MISMATCH' in s:
        hits.append((i,f.get('name'),s.count(old),s.count(new)))
assert len(hits)==1, hits
i,name,oldc,newc=hits[0]
assert oldc==1 and newc==0, hits
print('PIN_PREFLIGHT_PASS',name)
PY

      - name: Rebase only the Bootstrap outer SHA pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
import json,os
p=json.load(open('before.json'))
old=os.environ['OLD_OUTER_SHA']; new=os.environ['NEW_OUTER_SHA']
changed=0
for f in p.get('files') or []:
    s=str(f.get('source',''))
    if 'BOOT_SOURCE_OUTER_SHA_MISMATCH' in s:
        assert s.count(old)==1
        f['source']=s.replace(old,new,1)
        changed+=1
assert changed==1
json.dump({'files':p['files']},open('after.json','w'),ensure_ascii=False,separators=(',',':'))
PY
          code="$(curl --silent --show-error --output update-response.json --write-out '%{http_code}'             --request PUT             --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}"             --header 'Content-Type: application/json'             --data-binary @after.json             "https://script.googleapis.com/v1/projects/${BANKADS_GAS_SCRIPT_ID}/content")"
          test "$code" = 200 || { echo "UPDATE_CONTENT_HTTP_$code"; cat update-response.json; exit 1; }

      - name: Readback exact pin
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output readback.json --write-out '%{http_code}'             --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}"             "https://script.googleapis.com/v1/projects/${BANKADS_GAS_SCRIPT_ID}/content")"
          test "$code" = 200 || { echo "READBACK_HTTP_$code"; exit 1; }
          python3 - <<'PY'
import json,os
p=json.load(open('readback.json'))
old=os.environ['OLD_OUTER_SHA']; new=os.environ['NEW_OUTER_SHA']
hits=[]
for f in p.get('files') or []:
    s=str(f.get('source',''))
    if 'BOOT_SOURCE_OUTER_SHA_MISMATCH' in s:
        hits.append((f.get('name'),s.count(old),s.count(new)))
assert len(hits)==1 and hits[0][1]==0 and hits[0][2]==1, hits
print('BANKADS_BOOTSTRAP_PIN_REBASE_READBACK_PASS',hits[0][0])
PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f before.json after.json readback.json update-response.json token.json
