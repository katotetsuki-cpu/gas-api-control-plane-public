          openssl cms -encrypt -binary -aes256 \
            -in content.json \
            -out content.cms \
            -outform DER \
            recipient-cert.pem
          echo 'ENCRYPTED_ARTIFACT_READY'

      - name: Upload encrypted evidence
        uses: actions/upload-artifact@v4
        with:
          name: adtech-gas-readonly-encrypted
          path: |
            content.cms
            receipt.json
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup plaintext and token-adjacent files
        if: always()
        shell: bash
        run: |
          rm -f content.json http_code.txt recipient-cert.pem
