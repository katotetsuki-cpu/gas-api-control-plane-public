          openssl cms -encrypt -binary -aes256 \
            -in live-source.tgz \
            -out live-source.cms \
            -outform DER \
            recipient-cert.pem
          echo 'ENCRYPTED_ARTIFACT_READY'

      - name: Upload encrypted evidence
        uses: actions/upload-artifact@v4
        with:
          name: adtech-gas-readonly-encrypted
          path: |
            live-source.cms
            receipt.json
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup plaintext and token files
        if: always()
        shell: bash
        run: |
          rm -rf live live-source.tgz recipient-cert.pem
          rm -f "$HOME/.clasprc.json" /tmp/clasp-pull.log
