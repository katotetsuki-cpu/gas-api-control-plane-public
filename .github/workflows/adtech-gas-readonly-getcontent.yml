name: AdTech GAS Readonly GetContent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      ADTECH_GAS_SCRIPT_ID: ${{ secrets.ADTECH_GAS_SCRIPT_ID }}
    steps:
      - name: Validate credential presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_REFRESH_TOKEN:-}" || { echo 'MISSING_GOOGLE_REFRESH_TOKEN'; exit 1; }
          test -n "${ADTECH_GAS_SCRIPT_ID:-}" || { echo 'MISSING_ADTECH_GAS_SCRIPT_ID'; exit 1; }
          echo "::add-mask::${GOOGLE_REFRESH_TOKEN}"
          echo "::add-mask::${ADTECH_GAS_SCRIPT_ID}"
          echo 'CREDENTIAL_PRESENCE_PASS'

      - name: Read Production Apps Script source with clasp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live
          python3 - <<'PY'
          import json, os, pathlib
          home = pathlib.Path.home()
          cred = {
              'refresh_token': os.environ['GOOGLE_REFRESH_TOKEN'],
              'token_type': 'Bearer'
          }
          p = home / '.clasprc.json'
          p.write_text(json.dumps(cred), encoding='utf-8')
          p.chmod(0o600)
          cfg = {'scriptId': os.environ['ADTECH_GAS_SCRIPT_ID'], 'rootDir': '.'}
          pathlib.Path('live/.clasp.json').write_text(json.dumps(cfg), encoding='utf-8')
          PY
          (
            cd live
            npx -y @google/clasp@3.4.0 pull > /tmp/clasp-pull.log 2>&1
          ) || {
            echo 'CLASP_PULL_FAILED'
            tail -n 20 /tmp/clasp-pull.log | sed -E 's/[A-Za-z0-9_\/-]{20,}/[REDACTED]/g'
            exit 1
          }
          echo 'CLASP_PULL_PASS'

      - name: Build source-free receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('live')
          allowed = []
          total = 0
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.name == '.clasp.json':
                  continue
              rel = p.relative_to(root).as_posix()
              data = p.read_bytes()
              total += len(data)
              allowed.append({
                  'path_sha256': hashlib.sha256(rel.encode()).hexdigest(),
                  'source_sha256': hashlib.sha256(data).hexdigest(),
                  'source_bytes': len(data),
              })
          manifest_present = any(p.name == 'appsscript.json' for p in root.rglob('appsscript.json'))
          aggregate = hashlib.sha256(json.dumps(allowed, sort_keys=True, separators=(',',':')).encode()).hexdigest()
          receipt = {
              'state': 'PASS_READONLY_CLASP_PULL' if manifest_present else 'FAIL_MANIFEST_MISSING',
              'file_count': len(allowed),
              'manifest_present': manifest_present,
              'total_source_bytes': total,
              'aggregate_fingerprint': aggregate,
              'source_exposed': False,
              'mutation_count': 0,
          }
          Path('receipt.json').write_text(json.dumps(receipt, sort_keys=True, separators=(',',':')) + '\n', encoding='utf-8')
          print(Path('receipt.json').read_text(encoding='utf-8'), end='')
          if not manifest_present:
              raise SystemExit(1)
          PY

      - name: Package and encrypt source payload for AI-side inspection
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.clasp.json' -C live -czf live-source.tgz .
          cat > recipient-cert.pem <<'CERT'
-----BEGIN CERTIFICATE-----
