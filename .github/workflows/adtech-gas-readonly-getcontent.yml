name: AdTech GAS Readonly GetContent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_ACCESS_TOKEN }}
      ADTECH_GAS_SCRIPT_ID: ${{ secrets.ADTECH_GAS_SCRIPT_ID }}
    steps:
      - name: Validate ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_ACCESS_TOKEN:-}" || { echo 'MISSING_GOOGLE_ACCESS_TOKEN'; exit 1; }
          test -n "${ADTECH_GAS_SCRIPT_ID:-}" || { echo 'MISSING_ADTECH_GAS_SCRIPT_ID'; exit 1; }
          echo "::add-mask::${GOOGLE_ACCESS_TOKEN}"
          echo "::add-mask::${ADTECH_GAS_SCRIPT_ID}"
          echo 'CREDENTIAL_PRESENCE_PASS'

      - name: Read Production Apps Script content
        shell: bash
        run: |
          set -euo pipefail
          http_code="$(curl --silent --show-error \
            --output content.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
            "https://script.googleapis.com/v1/projects/${ADTECH_GAS_SCRIPT_ID}/content")"
          printf '%s' "$http_code" > http_code.txt
          if [ "$http_code" != '200' ]; then
            echo "GET_CONTENT_HTTP_${http_code}"
            rm -f content.json
            exit 1
          fi
          echo 'GET_CONTENT_HTTP_200'

      - name: Build source-free receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path('content.json').read_text(encoding='utf-8'))
          files = data.get('files') or []
          manifest_present = any(f.get('name') == 'appsscript' and f.get('type') == 'JSON' for f in files)
          normalized = []
          total_bytes = 0
          for f in files:
              src = f.get('source', '')
              total_bytes += len(src.encode('utf-8'))
              normalized.append({
                  'name_sha256': hashlib.sha256(str(f.get('name','')).encode()).hexdigest(),
                  'type': f.get('type',''),
                  'source_sha256': hashlib.sha256(src.encode()).hexdigest(),
                  'source_bytes': len(src.encode('utf-8')),
              })
          normalized.sort(key=lambda x: (x['name_sha256'], x['type']))
          aggregate = hashlib.sha256(json.dumps(normalized, sort_keys=True, separators=(',',':')).encode()).hexdigest()
          receipt = {
              'state': 'PASS_READONLY_GETCONTENT' if manifest_present else 'FAIL_MANIFEST_MISSING',
              'file_count': len(files),
              'manifest_present': manifest_present,
              'total_source_bytes': total_bytes,
              'aggregate_fingerprint': aggregate,
              'source_exposed': False,
              'mutation_count': 0,
          }
          Path('receipt.json').write_text(json.dumps(receipt, sort_keys=True, separators=(',',':')) + '\n', encoding='utf-8')
          print(Path('receipt.json').read_text(encoding='utf-8'), end='')
          if not manifest_present:
              raise SystemExit(1)
          PY

      - name: Encrypt source payload for AI-side inspection
        shell: bash
        run: |
          set -euo pipefail
          cat > recipient-cert.pem <<'CERT'
